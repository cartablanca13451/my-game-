
<!DOCTYPE html>
<html>
<head>
<title>Ghost Hunter</title>
<style>
body {
  margin: 0;
  background: #100c25;
  color: white;
  text-align: center;
  font-family: Arial;
}
h1 { color: #a78bfa; }
canvas {
  background: linear-gradient(#17113b,#08051b);
  border: 3px solid #8b5cf6;
  max-width: 95%;
}
button {
  background: #8b5cf6;
  color: white;
  border: 0;
  padding: 12px 25px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>👻 GHOST HUNTER 🔫</h1>
<p>Score: <span id="score">0</span>
 | Lives: <span id="lives">3</span></p>

<canvas id="game" width="600" height="450"></canvas>
<p>Move: ← → or A / D | Shoot: SPACE</p>
<button onclick="restart()">Restart Game</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, ghosts, bullets, score, lives, over;
let keys = {};

function restart() {
  player = {x:275, y:390, w:50, h:35};
  ghosts = [];
  bullets = [];
  score = 0;
  lives = 3;
  over = false;
  update();
}

document.addEventListener("keydown", e => {
  keys[e.code] = true;
  if(["Space","ArrowLeft","ArrowRight"].includes(e.code))
    e.preventDefault();
});
document.addEventListener("keyup", e => keys[e.code] = false);

function shoot() {
  bullets.push({x:player.x+23,y:player.y});
}

let cooldown = 0;
let spawn = 0;

function update() {
  if(over) return;

  ctx.clearRect(0,0,600,450);

  // Stars
  ctx.fillStyle = "#ffffff";
  for(let i=0;i<35;i++){
    ctx.fillRect((i*97)%600,(i*53)%450,2,2);
  }

  if(keys.ArrowLeft || keys.KeyA) player.x -= 5;
  if(keys.ArrowRight || keys.KeyD) player.x += 5;
  player.x = Math.max(0,Math.min(550,player.x));

  if(keys.Space && cooldown<=0){
    shoot();
    cooldown=15;
  }
  cooldown--;

  // Player
  ctx.font = "38px Arial";
  ctx.fillText("🚀",player.x,player.y+30);

  // Shoot bullets
  bullets.forEach(b => {
    b.y -= 8;
    ctx.font = "22px Arial";
    ctx.fillText("✨",b.x,b.y);
  });
  bullets = bullets.filter(b=>b.y>0);

  // Spawn ghosts
  spawn++;
  if(spawn>45){
    ghosts.push({
      x:Math.random()*550,
      y:-30,
      speed:1.5+Math.random()*2
    });
    spawn=0;
  }

  // Ghost movement
  ghosts.forEach(g=>{
    g.y += g.speed;
    ctx.font="35px Arial";
    ctx.fillText("👻",g.x,g.y);

    // Ghost hits player
    if(g.y>player.y && g.y<player.y+35 &&
       g.x>player.x-30 && g.x<player.x+50){
      lives--;
      g.y=500;
    }

    // Ghost escapes
    if(g.y>450){
      lives--;
      g.y=500;
    }

    // Bullet hits ghost
    bullets.forEach(b=>{
      if(Math.abs(b.x-g.x)<30 &&
         Math.abs(b.y-g.y)<30 && !g.hit){
        g.hit=true;
        score+=10;
        b.y=-100;
      }
    });
  });

  ghosts=ghosts.filter(g=>!g.hit && g.y<480);

  document.getElementById("score").textContent=score;
  document.getElementById("lives").textContent=lives;

  if(lives<=0){
    over=true;
    ctx.fillStyle="white";
    ctx.font="42px Arial";
    ctx.fillText("GAME OVER!",175,210);
    ctx.font="24px Arial";
    ctx.fillText("Final Score: "+score,220,255);
    return;
  }

  requestAnimationFrame(update);
}

restart();
</script>
</body>
</html>
