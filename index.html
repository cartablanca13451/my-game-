
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAT HORROR</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #050509;
  color: white;
  text-align: center;
  font-family: Arial;
}
h1 {
  color: #ff3030;
  text-shadow: 0 0 15px red;
}
canvas {
  width: 95%;
  max-width: 800px;
  background: #10101b;
  border: 3px solid #8b0000;
  box-shadow: 0 0 25px red;
}
button {
  padding: 12px 20px;
  background: darkred;
  border: 1px solid red;
  color: white;
  font-size: 17px;
  border-radius: 8px;
  margin: 8px;
}
</style>
</head>
<body>

<h1>🐱 CAT HORROR 👹</h1>
<p>❤️ GATO: 1 VIDA | 👹 FANTASTIC: 1 VIDA</p>
<p>Flechas o A/D para moverte | ESPACIO para disparar</p>

<canvas id="game" width="800" height="500"></canvas>
<br>
<button onclick="restart()">REINICIAR JUEGO</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let cat, monster, bullets, gameOver, won;
let keys = {};
let cooldown = 0;

function restart() {
  cat = {x:100, y:350, lives:1};
  monster = {x:650, y:350, lives:1};
  bullets = [];
  gameOver = false;
  won = false;
  cooldown = 0;
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => {
  keys[e.code] = true;
  if(e.code === "Space") e.preventDefault();
});
document.addEventListener("keyup", e => keys[e.code] = false);

function drawBackground() {
  ctx.fillStyle = "#090912";
  ctx.fillRect(0,0,800,500);

  // Luna
  ctx.fillStyle = "#b5b5c9";
  ctx.beginPath();
  ctx.arc(680,80,35,0,Math.PI*2);
  ctx.fill();

  // Árboles
  for(let i=0;i<12;i++) {
    let x=i*75;
    ctx.fillStyle="#080e0c";
    ctx.fillRect(x+25,180,18,300);
    ctx.beginPath();
    ctx.moveTo(x-30,230);
    ctx.lineTo(x+35,80);
    ctx.lineTo(x+100,230);
    ctx.fill();
  }

  ctx.fillStyle="#15120e";
  ctx.fillRect(0,440,800,60);
}

function drawCat() {
  ctx.font="55px Arial";
  ctx.fillText("🐱",cat.x,cat.y);

  // Arma de fantasía
  ctx.fillStyle="#777";
  ctx.fillRect(cat.x+40,cat.y-28,48,9);
  ctx.fillStyle="#333";
  ctx.fillRect(cat.x+55,cat.y-18,12,15);
}

function drawMonster() {
  ctx.font="75px Arial";
  ctx.fillText("👹",monster.x,monster.y);

  ctx.fillStyle="red";
  ctx.font="20px Arial";
  ctx.fillText("FANTASTIC",monster.x-10,monster.y+15);
}

function loop() {
  if(gameOver || won) {
    drawBackground();
    drawCat();
    drawMonster();

    ctx.fillStyle="red";
    ctx.font="48px Arial";
    ctx.textAlign="center";
    ctx.fillText(won ? "¡GANASTE!" : "GAME OVER",400,240);
    ctx.font="22px Arial";
    ctx.fillText(won ? "Fantastic ha sido derrotado." :
      "Fantastic te atrapó...",400,280);
    ctx.textAlign="left";
    return;
  }

  drawBackground();

  if(keys.ArrowRight || keys.KeyD)
    cat.x=Math.min(700,cat.x+4);
  if(keys.ArrowLeft || keys.KeyA)
    cat.x=Math.max(0,cat.x-4);

  if(keys.Space && cooldown<=0) {
    bullets.push({x:cat.x+75,y:cat.y-20});
    cooldown=20;
  }
  cooldown--;

  // Movimiento de Fantastic
  if(monster.x>cat.x+45) monster.x-=1.1;
  else if(monster.x<cat.x+30) monster.x+=1.1;

  // Disparos
  ctx.font="25px Arial";
  bullets.forEach(b=>{
    b.x+=9;
    ctx.fillText("🔥",b.x,b.y);

    if(Math.abs(b.x-monster.x)<55 &&
       Math.abs(b.y-monster.y)<65) {
      won=true;
    }
  });

  bullets=bullets.filter(b=>b.x<800);

  drawCat();
  drawMonster();

  // Colisión
  if(Math.abs(cat.x-monster.x)<55) {
    gameOver=true;
  }

  requestAnimationFrame(loop);
}

restart();
</script>
</body>
</html>
